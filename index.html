<script>/* Versión offline: sustituye los servicios de Claude por almacenamiento en el propio dispositivo */
window.OFFLINE=true;
(()=>{
const DBN='visitas-feria-offline',ST='docs';let dbp=null;
const open=()=>dbp||(dbp=new Promise((ok,ko)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}));
const run=async(mode,fn)=>{const d=await open();return new Promise((ok,ko)=>{const t=d.transaction(ST,mode);let out;fn(t.objectStore(ST),v=>{out=v});t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>ko(t.error)})};
const getK=k=>run('readonly',(s,set)=>{const q=s.get(k);q.onsuccess=()=>set(q.result)});
const putK=(k,v)=>run('readwrite',s=>{s.put(v,k)});
const listP=p=>run('readonly',(s,set)=>{const out=[];const c=s.openCursor(IDBKeyRange.bound(p,p+'￿'));c.onsuccess=()=>{const k=c.result;if(k){out.push([k.key,k.value]);k.continue()}else set(out)}});
const L=new Map(),on=(p,cb)=>{if(!L.has(p))L.set(p,new Set());L.get(p).add(cb);return()=>L.get(p).delete(cb)};
const meta={fromCache:false,hasPendingWrites:false};
const fireCol=async c=>{const set=L.get(c);if(!set||!set.size)return;const rows=await listP(c+'/');
  const snap={docs:rows.map(([k,v])=>({id:k.slice(c.length+1),exists:true,data:()=>v,metadata:meta})),size:rows.length,empty:!rows.length,metadata:meta,docChanges:()=>[]};
  set.forEach(cb=>{try{cb(snap)}catch(e){console.error(e)}})};
const fireDoc=async p=>{const set=L.get(p);if(!set||!set.size)return;const v=await getK(p);const snap={id:p.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta};
  set.forEach(cb=>{try{cb(snap)}catch(e){console.error(e)}})};
const parent=p=>p.split('/').slice(0,-1).join('/');
const changed=p=>{fireDoc(p);fireCol(parent(p))};
const docRef=p=>({id:p.split('/').pop(),path:p,
  get:async()=>{const v=await getK(p);return{id:p.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta}},
  set:async d=>{await putK(p,JSON.parse(JSON.stringify(d)));changed(p)},
  update:async d=>{const v=await getK(p);if(v===undefined)throw{code:'invalid_argument',message:'No existe'};await putK(p,{...v,...JSON.parse(JSON.stringify(d))});changed(p)},
  delete:async()=>{const v=await getK(p);await putK(p,{_del:true,updated:Date.now(),feria:v&&v.feria,clase:v&&v.clase});changed(p)},
  onSnapshot:(cb,err)=>{const u=on(p,cb);fireDoc(p).catch(e=>err&&err({code:'unavailable',message:String(e)}));return u},
  collection:c=>colRef(p+'/'+c)});
const colRef=c=>({path:c,doc:id=>docRef(c+'/'+(id||('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
  onSnapshot:(cb,err)=>{const u=on(c,cb);fireCol(c).catch(e=>err&&err({code:'unavailable',message:String(e)}));return u}});
const DB={collection:colRef,doc:docRef};

/* Descargas: Android descarga directamente; iPhone/iPad usa "Compartir" (Guardar en Archivos, AirDrop, WhatsApp…) */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',zip:'application/zip',json:'application/json'};
function sheet(html){const d=document.createElement('div');d.className='dlg';d.style.zIndex=40;d.innerHTML=`<div>${html}</div>`;document.body.appendChild(d);return d}
const downloads={save:({filename,data})=>new Promise((ok,ko)=>{
  const ext=String(filename).split('.').pop().toLowerCase(),type=MIME[ext]||'application/octet-stream',blob=new Blob([data],{type});
  const file=new File([blob],filename,{type});
  if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){
    const d=sheet(`<h2>Archivo listo</h2><p>${filename.replace(/[<>&"]/g,'')}<br>Pulsa «Guardar o enviar» y elige «Guardar en Archivos», AirDrop, WhatsApp, correo…</p><div class="btns"><button class="go" data-s="1">Guardar o enviar</button><button data-s="0">Cancelar</button></div>`);
    d.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;
      if(b.dataset.s==='0'){d.remove();ko({code:'declined',message:'Cancelado'});return}
      try{await navigator.share({files:[file]});d.remove();ok({status:'saved'})}catch(err){if(err&&err.name==='AbortError')return;d.remove();ko({code:'unavailable',message:String(err)})}};
    return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);ok({status:'saved'})})};

window.claude={use:async n=>({db:DB,downloads}[n]||null)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* Aviso de instalación si se abre en el navegador */
let bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;const b=document.getElementById('instBtn');if(b)b.hidden=false});
addEventListener('DOMContentLoaded',()=>{
  const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(inst)return;
  const m=document.querySelector('main');if(!m)return;const d=document.createElement('div');d.className='inst';
  d.innerHTML=`<b>Instala la app antes de usarla.</b> ${isIOS?'En Safari: botón Compartir → «Añadir a pantalla de inicio».':'En Chrome: menú ⋮ → «Añadir a pantalla de inicio» o «Instalar app».'} Después ábrela siempre desde ese icono y carga ahí el archivo de datos${isIOS?': en iPhone, lo que hagas en Safari no aparece en la app instalada':''}.<button id="instBtn" class="go" hidden>Instalar app</button>`;
  m.prepend(d);document.getElementById('instBtn').onclick=async()=>{if(bip){bip.prompt();bip=null;d.remove()}};
  if(bip)document.getElementById('instBtn').hidden=false});
})();
</script>

<style>
/* VOICE: herramienta de trabajo de pie en un pasillo de feria: rápida, clara, sin adornos
   IDEA: la ficha de papel con la tarjeta grapada, pasada a pantalla

   LAYOUT: cabecera marina fija, contenido en una columna de 680px, botón de guardar anclado abajo */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ee,#101418);--card:light-dark(#fff,#1a2027);--ink:light-dark(#14171c,#eef0f3);--mut:light-dark(#5d6470,#9aa3ae);--line:light-dark(#dedad3,#2c343d);--navy:#1f3864;--navy2:light-dark(#1f3864,#8fb0e6);--brick:#c8371e;--ok:light-dark(#0f7a3d,#5fd08f);--soft:light-dark(#edf1f8,#1d2a3d)}

.top .r+.r{margin-top:10px}

.sync{font-size:13px;opacity:.85;white-space:nowrap}

.sync.pend i{background:#ffb347}.sync.off i{background:#aab}
#feria{flex:1;min-height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;padding:0 12px;font-size:16px}
#feria option{color:#000}
.tbtn{min-height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;padding:0 14px;font-weight:700}
main,.form{max-width:680px;margin:0 auto;padding:14px max(4vw,14px) 120px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}

.ocr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.ocr button{min-height:44px;border-radius:10px;border:1.5px solid var(--navy2);background:var(--soft);color:var(--navy2);font-weight:700;padding:0 14px}.ocr span{font-size:14px;color:var(--mut)}
.ghostw{min-height:44px;border:0;background:none;color:#fff;font-weight:700;padding:0 8px}
.dlg[hidden]{display:none}.dlg{position:fixed;inset:0;z-index:20;background:#0008;display:grid;place-items:end center}

.dlg h2{margin:0 0 6px;font-size:22px}.dlg p{margin:0 0 14px;color:var(--mut)}
.dlg .btns{display:grid;gap:8px}
.dlg .btns button{min-height:50px;border-radius:12px;font-weight:700;border:1.5px solid var(--line);background:none}
.dlg .btns button.go{background:var(--navy);border-color:var(--navy);color:#fff}

.vw{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column;color:#fff}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zipParts(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;
  }
  const cs=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return[...parts,...central,new Uint8Array(e.buffer)];
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
const colL=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-1-m)/26}return s};
const serial=iso=>{const[y,m,d]=String(iso).split('-').map(Number);return y&&m&&d?(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5:''};
function xc(ref,v,s){
  if(v===''||v==null)return s?`<c r="${ref}" s="${s}"/>`:'';
  if(typeof v==='number')return`<c r="${ref}" s="${s||0}"><v>${v}</v></c>`;
  if(v.f)return`<c r="${ref}" s="${s||0}"><f>${xe(v.f)}</f></c>`;
  return`<c r="${ref}" s="${s||0}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
}

function buildXlsx(recs,spec,meta){
  const C=spec.cols,N=Math.max(300,recs.length+1),last=colL(C.length-1),idx=k=>colL(C.findIndex(c=>c[0]===k));
  const R=k=>`${spec.sheet}!$${idx(k)}$2:$${idx(k)}$${N}`;
  let rows=`<row r="1" ht="30" customHeight="1">${C.map((c,i)=>xc(colL(i)+1,c[1],1)).join('')}</row>`;
  recs.forEach((r,ri)=>{const RR=ri+2;
    rows+=`<row r="${RR}">`+C.map((c,i)=>{let v=r[c[0]];if(Array.isArray(v))v=v.join(', ');v=v==null?'':String(v).trim();
      let st=c[3]==='w'?3:2;if(c[3]==='d'){v=serial(v);st=4}else if(c[3]==='n'&&/^\d+([.,]\d+)?$/.test(v))v=Number(v.replace(',','.'));
      return xc(colL(i)+RR,v,st)}).join('')+'</row>'});
  const dv=Object.entries(spec.lists).map(([k,l])=>`<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${idx(k)}2:${idx(k)}${N}"><formula1>"${xe(l)}"</formula1></dataValidation>`);
  const E=idx('estado');let cf='',pr=1;
  if(spec.red){const P=idx(spec.red);cf+=`<conditionalFormatting sqref="${P}2:${P}${N}"><cfRule type="cellIs" dxfId="0" priority="${pr++}" operator="equal"><formula>"A"</formula></cfRule></conditionalFormatting>`}
  cf+=`<conditionalFormatting sqref="${E}2:${E}${N}"><cfRule type="cellIs" dxfId="1" priority="${pr++}" operator="equal"><formula>"Cerrado"</formula></cfRule></conditionalFormatting>`;
  if(spec.late){const L=idx(spec.late);cf+=`<conditionalFormatting sqref="${L}2:${L}${N}"><cfRule type="expression" dxfId="0" priority="${pr++}"><formula>${xe(`AND($${L}2<>"",$${L}2<TODAY(),$${E}2="Pendiente")`)}</formula></cfRule></conditionalFormatting>`}
  const tl=colL(spec.xs)+'2';
  const s1=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><dimension ref="A1:${last}${recs.length+1}"/>`+
   `<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane xSplit="${spec.xs}" ySplit="1" topLeftCell="${tl}" activePane="bottomRight" state="frozen"/><selection pane="bottomRight" activeCell="${tl}" sqref="${tl}"/></sheetView></sheetViews>`+
   `<sheetFormatPr defaultRowHeight="15"/><cols>${C.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c[2]}" customWidth="1"/>`).join('')}</cols>`+
   `<sheetData>${rows}</sheetData><autoFilter ref="A1:${last}${N}"/>${cf}<dataValidations count="${dv.length}">${dv.join('')}</dataValidations><pageMargins left="0.5" right="0.5" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>`;
  const pnl=[[spec.title,null,5],[`${meta.feria} · exportado el ${meta.fecha} desde la app de la feria. Se calcula sobre la hoja ${spec.sheet}.`,null,8],null,...spec.panel(R)];
  const s2=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="1" width="34" customWidth="1"/><col min="2" max="2" width="12" customWidth="1"/></cols><sheetData>`+
   pnl.map((r,i)=>!r?'':`<row r="${i+1}">${xc('A'+(i+1),r[0],r[2]||6)}${r[1]?xc('B'+(i+1),{f:r[1]},7):''}</row>`).join('')+`</sheetData><pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>`;
  const g=[...spec.guide,'',`PREPARADO HASTA LA FILA ${N}`];
  const s3=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="1" width="110" customWidth="1"/></cols><sheetData>`+
   g.map((t,i)=>t?`<row r="${i+1}">${xc('A'+(i+1),t,/^[A-ZÁÉÍÓÚ ]+$/.test(t.replace(/\d/g,''))?6:0)}</row>`:'').join('')+`</sheetData><pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>`+
   `<fonts count="5"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="13"/><color rgb="FF1F3864"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="10"/><name val="Calibri"/><family val="2"/></font><font><i/><sz val="10"/><color rgb="FF808080"/><name val="Calibri"/><family val="2"/></font></fonts>`+
   `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDF1F8"/><bgColor indexed="64"/></patternFill></fill></fills>`+
   `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFD9D9D9"/></bottom><diagonal/></border></borders>`+
   `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="9">`+
   `<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>`+
   `<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>`+
   `<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top"/></xf>`+
   `<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`+
   `<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>`+
   `<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>`+
   `<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>`+
   `<xf numFmtId="0" fontId="3" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center"/></xf>`+
   `<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>`+
   `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>`+
   `<dxfs count="2"><dxf><font><color rgb="FF9C0006"/></font><fill><patternFill><bgColor rgb="FFFFC7CE"/></patternFill></fill></dxf><dxf><font><color rgb="FF006100"/></font><fill><patternFill><bgColor rgb="FFC6EFCE"/></patternFill></fill></dxf></dxfs></styleSheet>`;
  const sheets=[spec.sheet,'Panel','Guía'];
  const files=[
   {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
   {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${NS}><bookViews><workbookView/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">${spec.sheet}!$A$1:$${last}$${N}</definedName></definedNames><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:'xl/styles.xml',data:styles},
   {name:'xl/worksheets/sheet1.xml',data:s1},{name:'xl/worksheets/sheet2.xml',data:s2},{name:'xl/worksheets/sheet3.xml',data:s3}];
  return zipParts(files);
}

function shrink(file,max,q){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
   c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(),'image/jpeg',q)};i.onerror=ko;i.src=u})}
const toData=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});

const CARD=`Estas fotos se han hecho en una feria de recambios de automoción, en el stand de un proveedor (casi siempre chino). Cada foto puede ser:
- el cartel o rótulo del stand: suele llevar el nombre de la empresa y el número de stand (p. ej. "10.2 F79"); los carteles y paneles muestran los productos;
- la tarjeta de visita del proveedor, a menudo en chino y en inglés;
- o fotos de producto.
Lee solo el texto impreso (rótulos, carteles y tarjetas). No describas ni identifiques a las personas que salgan. No inventes nada: si un dato no aparece, deja la cadena vacía.
Responde solo con un objeto JSON con estas claves:
{"empresa":"nombre de la empresa en caracteres latinos, tal como aparece","stand":"número de stand tal como aparece (pabellón y stand)","productos":"productos que fabrica según carteles o tarjeta, en español y breve (p. ej. Filtros de aire, habitáculo y aceite)","contacto":"nombre de la persona de la tarjeta, con su nombre inglés si lo tiene","cargo":"cargo tal como aparece en inglés","email":"email","telefono":"móvil o teléfono con prefijo internacional; si hay varios, el móvil","ciudad":"ciudad de la dirección de la fábrica en inglés (p. ej. Yuhuan City)"}`;
const labelOf=k=>(ALLF.find(f=>f.k===k)||{}).l||k;
function setOcr(id,m){ocrMsg[id]=m;if(cur&&cur.id===id){const el=document.getElementById('ocrMsg');if(el)el.textContent=m;else renderFormKeep()}}
async function ocrFromPhotos(){
  if(!cur||ocrBusy)return;const id=cur.id,max=Math.min(3,(cur.imgs||[]).length);setOcr(id,'Preparando fotos…');
  try{const bl=[];for(const im of cur.imgs.slice(0,max))bl.push(await(await fetch(src(im))).blob());readCard(id,bl)}catch(e){setOcr(id,'No se pudieron leer las fotos.')}
}
const ocrQ=[];
async function readCard(id,blobs){
  if(!sample)return;if(ocrBusy){ocrQ.push([id,blobs]);setOcr(id,'Foto en cola para leer…');return}ocrBusy=true;setOcr(id,'Leyendo foto…');if(cur&&cur.id===id)renderFormKeep();
  let msg='';
  try{
    const r=await sample.json(CARD,{images:blobs,modelTier:'quick'})||{};
    const t=x=>String(x??'').trim();
    const got={empresa:t(r.empresa),contacto:t(r.contacto),cargo:t(r.cargo),email:[t(r.email),t(r.telefono)].filter(Boolean).join(' / '),ciudad:t(r.ciudad),gama:t(r.productos),stand:t(r.stand)};
    const live=cur&&cur.id===id,tgt=live?cur:{...(all().find(x=>x.id===id)||{})};
    if(!tgt.id)return;
    if(clase(tgt)==='Reunión'){for(const k of Object.keys(got))if(k!=='empresa')delete got[k];const c=codeFor(got.empresa||tgt.empresa);if(c)got.codigo=c}
    const filled=Object.keys(got).filter(k=>got[k]&&!t(tgt[k]));
    filled.forEach(k=>tgt[k]=got[k].slice(0,200));
    msg=filled.length?'Rellenado: '+filled.map(labelOf).join(', ')+'. Revísalo.':'Esta foto no añade datos nuevos.';
    ocrBusy=false;ocrMsg[id]=msg;
    if(live&&cur&&cur.id===id){draft();renderFormKeep();filled.forEach(k=>document.getElementById('f_'+k)?.classList.add('ai'))}
    else if(filled.length){put(tgt);toast('Ficha '+tgt.num+' completada con las fotos')}
    return;
  }catch(e){
    msg=e&&e.code==='not_granted'?'Lectura de tarjetas no permitida en este móvil.':e&&e.code==='rate_limited'?'Demasiadas lecturas seguidas; prueba en un momento.':e&&e.code==='images_unavailable'?'Esta vista no puede enviar fotos a Claude.':'No se pudo leer. Prueba otra foto, recta y con luz.';
  }finally{ocrBusy=false;if(ocrQ.length)setTimeout(()=>readCard(...ocrQ.shift()),0)}
  setOcr(id,msg);
}

let vwOpen=false,vi=0,zoom=1;const vsc=$('#vwsc'),vimg=$('#vwimg');
function fitW(){const W=vsc.clientWidth,H=vsc.clientHeight,w=vimg.naturalWidth||1,hh=vimg.naturalHeight||1;return Math.min(W,H*w/hh)}
function setZoom(z,cx,cy){
  z=Math.max(1,Math.min(6,z));if(cx==null){cx=vsc.clientWidth/2;cy=vsc.clientHeight/2}
  const rx=(vsc.scrollLeft+cx)/Math.max(1,vsc.scrollWidth),ry=(vsc.scrollTop+cy)/Math.max(1,vsc.scrollHeight);
  zoom=z;vimg.style.width=fitW()*z+'px';vimg.style.height='auto';
  vsc.scrollLeft=rx*vsc.scrollWidth-cx;vsc.scrollTop=ry*vsc.scrollHeight-cy;
}

let pinch=null,lastTap=0;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
vsc.addEventListener('touchstart',e=>{if(e.touches.length===2){const r=vsc.getBoundingClientRect();pinch={d:dist(e.touches),z:zoom,cx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}},{passive:true});
vsc.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();setZoom(pinch.z*dist(e.touches)/pinch.d,pinch.cx,pinch.cy)}},{passive:false});
vsc.addEventListener('touchend',e=>{
  if(pinch){if(e.touches.length<2)pinch=null;lastTap=0;return}
  if(e.changedTouches.length!==1||e.touches.length)return;
  const now=Date.now(),t=e.changedTouches[0],r=vsc.getBoundingClientRect();
  if(now-lastTap<300){e.preventDefault();setZoom(zoom>1.2?1:2.5,t.clientX-r.left,t.clientY-r.top);lastTap=0}else lastTap=now;
});
vsc.addEventListener('dblclick',e=>{const r=vsc.getBoundingClientRect();setZoom(zoom>1.2?1:2.5,e.clientX-r.left,e.clientY-r.top)});

async function genActa(){
  if(!sample||actaBusy||!cur)return;const r=cur,id=r.id;
  const tr=(r.puntos||[]).filter(x=>x.ok&&String(x.t).trim()),pe=(r.puntos||[]).filter(x=>!x.ok&&String(x.t).trim());
  if(!tr.length&&!pe.length){toast('Añade primero los puntos de la reunión');return}
  if(String(r.acta||'').trim()&&await ask('¿Rehacer el acta?','Se sustituirá el texto actual del acta.',[['Rehacer','go'],['Cancelar','']])!=='Rehacer')return;
  const fd=r.rfecha||r.fecha||'';
  const prompt=`Redacta en inglés un email de seguimiento breve y profesional que un responsable de compras de TRICLO S.A. (distribuidor español de recambios de automoción) enviará al proveedor tras una reunión en la feria «${r.feria}».
Reglas: usa solo los datos de abajo; no inventes acuerdos, cifras, fechas ni compromisos. Resume los puntos tratados con sus acuerdos; lista los puntos pendientes como temas a seguir; pide confirmación de lo acordado. Tono cordial y directo, sin relleno.
Formato: primera línea «Subject: ...», una línea en blanco y el cuerpo. Firma: «Best regards,» y debajo ${r.visitado?`«${r.visitado}»`:'nada más que'} «TRICLO S.A.».

Proveedor: ${r.empresa||''}
Fecha de la reunión: ${fd}${r.rhora?' '+r.rhora:''}
Participantes: ${String(r.partic||'').replace(/\n/g,', ')}
Puntos tratados (con acuerdo si lo hay):
${tr.map(x=>'- '+x.t.trim()+(String(x.n||'').trim()?' (detalle: '+String(x.n).trim()+')':'')+(String(x.a||'').trim()?' → acuerdo: '+x.a.trim():' → sin acuerdo anotado')).join('\n')||'- ninguno'}
Puntos pendientes:
${pe.map(x=>'- '+x.t.trim()).join('\n')||'- ninguno'}`;
  actaBusy=true;setActaMsg('Pensando…');renderFormKeep();
  try{
    const res=await sample(prompt,{cache:false,onText:({text})=>{if(cur&&cur.id===id){cur.acta=text;const el=document.getElementById('f_acta');if(el)el.value=text;setActaMsg('Escribiendo…')}}});
    actaBusy=false;actaMsg='Acta lista. Revísala antes de enviarla.';
    if(cur&&cur.id===id){cur.acta=res.text;draft();renderFormKeep()}
    else{const s0=all().find(x=>x.id===id);if(s0){put({...s0,acta:res.text});toast('Acta guardada en la ficha '+s0.num)}}
  }catch(e){actaBusy=false;
    actaMsg=e&&e.code==='not_granted'?'No se ha permitido usar Claude en este móvil.':e&&e.code==='rate_limited'?'Demasiadas peticiones; prueba en un momento.':'No se pudo redactar. Inténtalo de nuevo.';
    if(cur&&cur.id===id){if(e&&e.text)cur.acta=e.text;renderFormKeep()}}
}

    fichas.push(r)}
  const d=new Date(),stamp=d.toISOString().slice(0,16).replace(/[-:T]/g,''),yo=ls.get('vf_yo','');
  const data={app:'visitas-feria',v:1,tipo:IS_OFF?'vuelta':'viaje',feria,exportado:d.toISOString(),por:yo,fichas,presets,maestro};
  save(IS_OFF?`Datos_vuelta_${slug(feria)}_${slug(yo)||'dispositivo'}_${stamp}.json`:`Datos_viaje_${slug(feria)}_${stamp}.json`,new Blob([JSON.stringify(data)],{type:'application/json'}));
}
async function importData(file){
  if(!col){toast('Los datos aún no están disponibles');return}
  let data=null;try{data=JSON.parse(await file.text())}catch(e){}
  if(!data||data.app!=='visitas-feria'||!Array.isArray(data.fichas)){await ask('Archivo no válido','Ese archivo no es un archivo de datos de esta app.',[['Entendido','go']]);return}
  const fe=String(data.feria||feria),vivos=data.fichas.filter(x=>x&&!x._del).length;
  const ok=await ask('Cargar archivo de datos',`Archivo de ${data.tipo==='vuelta'?'vuelta':'viaje'} de «${h(fe)}»${data.por?` (${h(data.por)})`:''}: ${vivos} ficha${vivos===1?'':'s'}. Se junta con lo que ya hay en ${IS_OFF?'este dispositivo':'la app'}; si una ficha está en los dos sitios, se queda la versión más reciente.`,[['Cargar','go'],['Cancelar','']]);
  if(ok!=='Cargar')return;
  toast('Cargando datos…');
  const have=new Map(rawAll().map(r=>[r.id,r]));let add=0,upd=0,del=0,err=0;
  for(const r0 of data.fichas){
    if(!r0||typeof r0.id!=='string'||!/^[\w.\-~:@+]{1,190}$/.test(r0.id))continue;
    const r=JSON.parse(JSON.stringify(r0));r.feria=r.feria||fe;const ex=have.get(r.id);
    if(ex&&(+ex.updated||0)>=(+r.updated||0))continue;
    try{
      if(r._del){await col.doc(r.id).set({_del:true,updated:+r.updated||Date.now(),feria:r.feria||'',clase:r.clase||''});if(ex&&!ex._del)del++;have.set(r.id,r);continue}
      if(Array.isArray(r.imgs)&&assets)for(const im of r.imgs){if(im.d&&!im.id){try{const b=await(await fetch(im.d)).blob();const a=await assets.upload(b);im.id=a.id;delete im.d}catch(e){}}}
      const{id,...body}=r;await col.doc(id).set(body);if(outbox[id]){delete outbox[id];persist()}
      ex&&!ex._del?upd++:add++;have.set(id,r);
    }catch(e){err++}
  }
  // números repetidos: conserva el número la ficha creada antes
  const ren=[],live=[...have.values()].filter(r=>!r._del&&r.feria===fe);
  for(const cl of ['Visita','Reunión']){const Lr=live.filter(r=>clase(r)===cl).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0),seen=new Set();let mx=Math.max(0,...Lr.map(r=>+r.num||0));
    for(const r of Lr){const n=String(r.num||'').trim();if(n&&!seen.has(n)){seen.add(n);continue}
      const nn=String(++mx);seen.add(nn);const r2={...r,num:nn,updated:Date.now()};const{id,...b}=r2;
      try{await col.doc(id).set(b);have.set(id,r2);ren.push(`${cl} ${h(n||'sin nº')} → ${nn} (${h(r.empresa||'')})`)}catch(e){err++}}}
  // puntos habituales y maestro
  try{if(Array.isArray(data.presets)&&data.presets.length){
    let items;if(data.tipo==='viaje')items=data.presets.filter(x=>x&&x.k&&x.t);
    else{items=presets.map(x=>({...x}));for(const p of data.presets){if(!p||!p.k)continue;const q=items.find(x=>x.k===p.k);if(!q)items.push(p);else if(!String(q.info||'').trim()&&String(p.info||'').trim())q.info=p.info}}
    if(items.length&&JSON.stringify(items)!==JSON.stringify(presets))await db.doc('config/puntos').set({items})}
   if(data.tipo==='viaje'&&Array.isArray(data.maestro)&&data.maestro.length)await db.doc('config/maestro').set({items:data.maestro})}catch(e){err++}
  feria=fe;ferias.add(fe);saveFerias();ls.set('vf_feria',fe);renderAll();
  await ask('Datos cargados',`${add} nueva${add===1?'':'s'}, ${upd} actualizada${upd===1?'':'s'}${del?`, ${del} borrada${del===1?'':'s'}`:''}.${ren.length?`<br><br>Números cambiados para no repetir:<br>${ren.join('<br>')}`:''}${err?`<br><br>${err} no se pudieron guardar: vuelve a cargar el archivo.`:''}`,[['Entendido','go']]);
}
async function save(filename,data){try{await dl.save({filename,data});toast('Descargado')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar ('+(e.code||'error')+')')}}

/* ---------- diálogos ---------- */
let dlgRes=null;
function ask(t,p,btns){return new Promise(ok=>{dlgRes=ok;$('#dlgIn').innerHTML=`<h2>${h(t)}</h2><p>${p}</p><div class="btns">${btns.map(([l,c])=>`<button class="${c}" data-a="${h(l)}">${h(l)}</button>`).join('')}</div>`;$('#dlg').hidden=false;$('#dlgIn button').focus()})}
function askText(t,p){return new Promise(ok=>{dlgRes=v=>ok(v==='OK'?$('#dlgT').value.trim():'');$('#dlgIn').innerHTML=`<h2>${h(t)}</h2><p>${h(p)}</p><div class="f" style="margin-bottom:12px"><input id="dlgT"></div><div class="btns"><button class="go" data-a="OK">Crear</button><button data-a="">Cancelar</button></div>`;$('#dlg').hidden=false;$('#dlgT').focus()})}
$('#dlg').onclick=e=>{const pb=e.target.closest('[data-pre]');if(pb){addPreset(pb.dataset.pre,pb);return}
  const b=e.target.closest('[data-a]');if(b||e.target.id==='dlg'){const r=dlgRes;dlgRes=null;$('#dlg').hidden=true;if(r)r(b?b.dataset.a:'')}};
function openPresets(){if(!cur)return;dlgRes=()=>{};const have=new Set((cur.puntos||[]).map(x=>x.pre).filter(Boolean));
  $('#dlgIn').innerHTML=`<h2>Puntos habituales</h2><p>Toca los que quieras añadir a esta reunión.</p><div class="prelist">${presets.map(q=>`<button type="button" class="pre" data-pre="${h(q.k)}" ${have.has(q.k)?'disabled':''}><span>${h(q.t)}</span><span class="tg">${rtag(q.r)}</span></button>`).join('')}</div><div class="btns" style="margin-top:12px"><button class="go" data-a="ok">Hecho</button></div>`;$('#dlg').hidden=false}
function addPreset(k,btn){const q=presets.find(x=>x.k===k);if(!q||!cur||(cur.puntos||[]).some(x=>x.pre===k))return;
  cur.puntos=[...(cur.puntos||[]),{id:uid(),t:q.t,ok:false,r:[...(q.r||[])],pre:k}];syncAcc(cur);draft();renderFormKeep();btn.disabled=true}
function editPreset(k){const q=presets.find(x=>x.k===k);if(!q||!db)return;
  dlgRes=async v=>{if(v!=='Guardar')return;const t=$('#dlgP').value.trim(),items=presets.map(x=>x.k===k?{...x,info:t}:x);
    try{await db.doc('config/puntos').set({items});presets=items;toast('Información guardada para todo el equipo');renderFormKeep()}catch(e){toast('No se pudo guardar. Revisa la conexión.')}};
  $('#dlgIn').innerHTML=`<h2>${h(q.t)}</h2><p>Información de este punto habitual. La verá todo el equipo en todas las reuniones.</p><div class="f" style="margin-bottom:12px"><textarea id="dlgP" rows="7">${h(q.info||'')}</textarea></div><div class="btns"><button class="go" data-a="Guardar">Guardar</button><button data-a="">Cancelar</button></div>`;
  $('#dlg').hidden=false;$('#dlgP').focus()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- arranque ---------- */
renderAll();
addEventListener('online',flush);
(async()=>{
  if(!window.claude||!claude.use){status='off';renderSync();return}
  status='load';renderSync();
  claude.use('downloads').then(x=>dl=x).catch(()=>{});
  claude.use('assets').then(x=>assets=x).catch(()=>{});
  claude.use('sample').then(async x=>{sample=x;if(x){const l=await x.limits().catch(()=>null);sampleImg=!!(l&&l.images);if(cur)renderFormKeep()}}).catch(()=>{});
  db=await claude.use('db').catch(()=>null);
  if(!db){status='off';renderSync();return}
  col=db.collection('visitas');
  db.doc('config/puntos').onSnapshot(d=>{const it=d.exists&&d.data().items;const ok=Array.isArray(it)?it.filter(x=>x&&x.k&&x.t):[];presets=ok.length?ok:PRE_DEF;if(cur&&!document.activeElement?.matches('#form textarea,#form input'))renderFormKeep()},()=>{});
  db.doc('config/maestro').onSnapshot(d=>{const it=d.exists&&d.data().items;maestro=Array.isArray(it)?it.filter(x=>x&&x.n):[];if(cur)renderFormKeep()},()=>{});
  const timer=setTimeout(()=>{if(status==='load'){status='off';renderSync()}},10000);
  col.onSnapshot(s=>{
    rows.clear();s.docs.forEach(d=>rows.set(d.id,{...d.data(),id:d.id}));
    if(!s.metadata.fromCache){clearTimeout(timer);status='on'}
    if(cur==null)renderAll();else{renderFerias();renderSync()}
    flush();
  },()=>{clearTimeout(timer);status='off';renderSync()});
  flush();
})();
}
</script>
