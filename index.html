<script>/* Versión offline: sustituye los servicios de Claude por almacenamiento en el propio dispositivo */
window.OFFLINE=true;
(()=>{
const DBN='visitas-feria-offline',ST='docs';let dbp=null;
const open=()=>dbp||(dbp=new Promise((ok,ko)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}));
const run=async(mode,fn)=>{const d=await open();return new Promise((ok,ko)=>{const t=d.transaction(ST,mode);let out;fn(t.objectStore(ST),v=>{out=v});t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>ko(t.error)})};
const getK=k=>run('readonly',(s,set)=>{const q=s.get(k);q.onsuccess=()=>set(q.result)});
const putK=(k,v)=>run('readwrite',s=>{s.put(v,k)});
const listP=p=>run('readonly',(s,set)=>{const out=[];const c=s.openCursor(IDBKeyRange.bound(p,p+'￿'));c.onsuccess=()=>{const k=c.result;if(k){out.push([k.key,k.value]);k.continue()}else set(out)}});
const L=new Map(),on=(p,cb)=>{if(!L.has(p))L.set(p,new Set());L.get(p).add(cb);return()=>L.get(p).delete(cb)};
const meta={fromCache:false,hasPendingWrites:false};
const fireCol=async c=>{const set=L.get(c);if(!set||!set.size)return;const rows=await listP(c+'/');
  const snap={docs:rows.map(([k,v])=>({id:k.slice(c.length+1),exists:true,data:()=>v,metadata:meta})),size:rows.length,empty:!rows.length,metadata:meta,docChanges:()=>[]};
  set.forEach(cb=>{try{cb(snap)}catch(e){console.error(e)}})};
const fireDoc=async p=>{const set=L.get(p);if(!set||!set.size)return;const v=await getK(p);const snap={id:p.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta};
  set.forEach(cb=>{try{cb(snap)}catch(e){console.error(e)}})};
const parent=p=>p.split('/').slice(0,-1).join('/');
const changed=p=>{fireDoc(p);fireCol(parent(p))};
const docRef=p=>({id:p.split('/').pop(),path:p,
  get:async()=>{const v=await getK(p);return{id:p.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta}},
  set:async d=>{await putK(p,JSON.parse(JSON.stringify(d)));changed(p)},
  update:async d=>{const v=await getK(p);if(v===undefined)throw{code:'invalid_argument',message:'No existe'};await putK(p,{...v,...JSON.parse(JSON.stringify(d))});changed(p)},
  delete:async()=>{const v=await getK(p);await putK(p,{_del:true,updated:Date.now(),feria:v&&v.feria,clase:v&&v.clase});changed(p)},
  onSnapshot:(cb,err)=>{const u=on(p,cb);fireDoc(p).catch(e=>err&&err({code:'unavailable',message:String(e)}));return u},
  collection:c=>colRef(p+'/'+c)});
const colRef=c=>({path:c,doc:id=>docRef(c+'/'+(id||('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
  onSnapshot:(cb,err)=>{const u=on(c,cb);fireCol(c).catch(e=>err&&err({code:'unavailable',message:String(e)}));return u}});
const DB={collection:colRef,doc:docRef};

/* Descargas: Android descarga directamente; iPhone/iPad usa "Compartir" (Guardar en Archivos, AirDrop, WhatsApp…) */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',zip:'application/zip',json:'application/json'};
function sheet(html){const d=document.createElement('div');d.className='dlg';d.style.zIndex=40;d.innerHTML=`<div>${html}</div>`;document.body.appendChild(d);return d}
const downloads={save:({filename,data})=>new Promise((ok,ko)=>{
  const ext=String(filename).split('.').pop().toLowerCase(),type=MIME[ext]||'application/octet-stream',blob=new Blob([data],{type});
  const file=new File([blob],filename,{type});
  if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){
    const d=sheet(`<h2>Archivo listo</h2><p>${filename.replace(/[<>&"]/g,'')}<br>Pulsa «Guardar o enviar» y elige «Guardar en Archivos», AirDrop, WhatsApp, correo…</p><div class="btns"><button class="go" data-s="1">Guardar o enviar</button><button data-s="0">Cancelar</button></div>`);
    d.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;
      if(b.dataset.s==='0'){d.remove();ko({code:'declined',message:'Cancelado'});return}
      try{await navigator.share({files:[file]});d.remove();ok({status:'saved'})}catch(err){if(err&&err.name==='AbortError')return;d.remove();ko({code:'unavailable',message:String(err)})}};
    return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);ok({status:'saved'})})};

window.claude={use:async n=>({db:DB,downloads}[n]||null)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* Aviso de instalación si se abre en el navegador */
let bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;const b=document.getElementById('instBtn');if(b)b.hidden=false});
addEventListener('DOMContentLoaded',()=>{
  const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(inst)return;
  const m=document.querySelector('main');if(!m)return;const d=document.createElement('div');d.className='inst';
  d.innerHTML=`<b>Instala la app antes de usarla.</b> ${isIOS?'En Safari: botón Compartir → «Añadir a pantalla de inicio».':'En Chrome: menú ⋮ → «Añadir a pantalla de inicio» o «Instalar app».'} Después ábrela siempre desde ese icono y carga ahí el archivo de datos${isIOS?': en iPhone, lo que hagas en Safari no aparece en la app instalada':''}.<button id="instBtn" class="go" hidden>Instalar app</button>`;
  m.prepend(d);document.getElementById('instBtn').onclick=async()=>{if(bip){bip.prompt();bip=null;d.remove()}};
  if(bip)document.getElementById('instBtn').hidden=false});
})();
</script>

<style>
/* VOICE: herramienta de trabajo de pie en un pasillo de feria: rápida, clara, sin adornos
   IDEA: la ficha de papel con la tarjeta grapada, pasada a pantalla

:root{color-scheme:light dark;--bg:light-dark(#f3f1ee,#101418);--card:light-dark(#fff,#1a2027);--ink:light-dark(#14171c,#eef0f3);--mut:light-dark(#5d6470,#9aa3ae);--line:light-dark(#dedad3,#2c343d);--navy:#1f3864;--navy2:light-dark(#1f3864,#8fb0e6);--brick:#c8371e;--ok:light-dark(#0f7a3d,#5fd08f);--soft:light-dark(#edf1f8,#1d2a3d)}

.logo{height:26px;width:auto;flex:none;display:block}
.sync{font-size:13px;opacity:.85;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fd08f;margin-right:6px;vertical-align:1px}
.sync.pend i{background:#ffb347}.sync.off i{background:#aab}

.hr{margin-left:auto;font-size:18px;line-height:1.1;font-weight:800;white-space:nowrap;padding:3px 8px;border-radius:8px;background:#ffc93c;color:#3a2a00;border:1.5px solid #e0a800}.rgt{margin-left:auto;display:flex;gap:6px;align-items:center}.rgt:empty{display:none}.rgt .hr,.rgt .std{margin-left:0}
.card.done h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#2fa84f}.card.done .hr{background:none;border-color:var(--line);color:var(--mut)}
.card h3{margin:0;font-size:18px;line-height:1.2;overflow-wrap:anywhere}

.tags{display:flex;gap:5px;flex-wrap:wrap}

.tag.A{background:var(--brick);color:#fff}.tag.ok{color:var(--ok)}.tag.pend{background:#ffb34733}

#vForm.done .fhead,#vForm.done .pri{background:#2fa84f!important}.seg button[data-v=Hecha][aria-pressed=true],.seg button[data-v=Visitada][aria-pressed=true]{background:#2fa84f;border-color:#2fa84f}

#vForm.reu .fhead,#vForm.reu .pri{background:#7a3fc0}
.seg button[data-v="Reunión"][aria-pressed=true]{background:#7a3fc0;border-color:#7a3fc0}

.fhead{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px max(4vw,14px)}
.fhead b{flex:1;text-align:center;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
fieldset{border:0;margin:0 0 6px;padding:0}

.rs-Compras{background:light-dark(#e3e9f5,#1d2a3d);color:var(--navy2)}.rs-Calidad{background:light-dark(#fdecd6,#3a2a12);color:light-dark(#9a4a00,#ffb866)}
.info{margin:8px 0 4px 50px;padding:10px;border-radius:10px;background:var(--soft);display:grid;gap:8px}
.info textarea{width:100%;min-height:60px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:8px;font-size:15px}
.il{font-size:13px;font-weight:700;color:var(--mut)}.irow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px}.rt[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.iguide p{margin:2px 0;white-space:pre-wrap;font-size:15px}.lk{border:0;background:none;color:var(--navy2);font-weight:700;padding:6px 0;text-decoration:underline;min-height:36px;text-align:left}
.prebtn{margin-top:8px;min-height:44px;border-radius:10px;border:1.5px solid light-dark(#0b6e6e,#5fc4c4);background:none;color:light-dark(#0b6e6e,#5fc4c4);font-weight:700;padding:0 14px}
.prelist{display:grid;gap:6px;max-height:55vh;overflow:auto}
.pre{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;min-height:48px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.pre:disabled{opacity:.55}.pre:disabled span:first-child::before{content:'✓ '}.pre .tg{display:flex;gap:4px;flex:none}
.ordb{margin-left:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--navy2);background:none;color:var(--navy2);font-weight:700;font-size:13px;vertical-align:middle}.ordb.on{background:var(--navy2);color:var(--card)}
.ordm li{display:flex;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:2px 4px;user-select:none;-webkit-user-select:none}
.ordm li.drag{box-shadow:0 8px 20px rgba(0,0,0,.25);border-color:var(--navy2);position:relative;z-index:2}
.ordm .hdl{flex:none;width:40px;height:44px;display:grid;place-items:center;font-size:22px;color:var(--mut);touch-action:none;cursor:grab}
.ordm .ot{flex:1;padding:8px 2px;overflow-wrap:anywhere}.ordm .ot .tg{display:inline-flex;gap:3px;vertical-align:1px}
.ordm li.ok .ot{color:var(--mut)}
.ordm .mv{flex:none;width:40px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--soft);font-size:18px;font-weight:700}.ordm .mv:disabled{opacity:.3}
.card.nvc{border-left-color:var(--brick)}.card.nvc .kind{background:var(--brick)}.card.nvc h3,.card.nvc p,.card.nvc .tags,.card.nvc .th{opacity:.6}.card.nvc h3{text-decoration:line-through;text-decoration-thickness:1px}.tag.nvt{background:#8883;color:inherit}
.now{display:block;margin:3px 0 0 50px;font-size:13px;color:var(--mut)}.now b{font-weight:700}
.cnt{font-weight:500;color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111d;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--mut);margin:14px 0 0}
@media(max-width:420px){.stats b{font-size:22px}.grid{gap:10px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zipParts(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;
  }
  const cs=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return[...parts,...central,new Uint8Array(e.buffer)];
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
const colL=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-1-m)/26}return s};
const serial=iso=>{const[y,m,d]=String(iso).split('-').map(Number);return y&&m&&d?(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5:''};
function xc(ref,v,s){
  if(v===''||v==null)return s?`<c r="${ref}" s="${s}"/>`:'';
  if(typeof v==='number')return`<c r="${ref}" s="${s||0}"><v>${v}</v></c>`;
  if(v.f)return`<c r="${ref}" s="${s||0}"><f>${xe(v.f)}</f></c>`;
  return`<c r="${ref}" s="${s||0}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
}

const CARD=`Estas fotos se han hecho en una feria de recambios de automoción, en el stand de un proveedor (casi siempre chino). Cada foto puede ser:
- el cartel o rótulo del stand: suele llevar el nombre de la empresa y el número de stand (p. ej. "10.2 F79"); los carteles y paneles muestran los productos;
- la tarjeta de visita del proveedor, a menudo en chino y en inglés;
- o fotos de producto.
Lee solo el texto impreso (rótulos, carteles y tarjetas). No describas ni identifiques a las personas que salgan. No inventes nada: si un dato no aparece, deja la cadena vacía.
Responde solo con un objeto JSON con estas claves:
{"empresa":"nombre de la empresa en caracteres latinos, tal como aparece","stand":"número de stand tal como aparece (pabellón y stand)","productos":"productos que fabrica según carteles o tarjeta, en español y breve (p. ej. Filtros de aire, habitáculo y aceite)","contacto":"nombre de la persona de la tarjeta, con su nombre inglés si lo tiene","cargo":"cargo tal como aparece en inglés","email":"email","telefono":"móvil o teléfono con prefijo internacional; si hay varios, el móvil","ciudad":"ciudad de la dirección de la fábrica en inglés (p. ej. Yuhuan City)"}`;
const labelOf=k=>(ALLF.find(f=>f.k===k)||{}).l||k;

    const got={empresa:t(r.empresa),contacto:t(r.contacto),cargo:t(r.cargo),email:[t(r.email),t(r.telefono)].filter(Boolean).join(' / '),ciudad:t(r.ciudad),gama:t(r.productos),stand:t(r.stand)};
    const live=cur&&cur.id===id,tgt=live?cur:{...(all().find(x=>x.id===id)||{})};
    if(!tgt.id)return;
    if(clase(tgt)==='Reunión'){for(const k of Object.keys(got))if(k!=='empresa')delete got[k];const c=codeFor(got.empresa||tgt.empresa);if(c)got.codigo=c}
    const filled=Object.keys(got).filter(k=>got[k]&&!t(tgt[k]));
    filled.forEach(k=>tgt[k]=got[k].slice(0,200));
    msg=filled.length?'Rellenado: '+filled.map(labelOf).join(', ')+'. Revísalo.':'Esta foto no añade datos nuevos.';
    ocrBusy=false;ocrMsg[id]=msg;
    if(live&&cur&&cur.id===id){draft();renderFormKeep();filled.forEach(k=>document.getElementById('f_'+k)?.classList.add('ai'))}
    else if(filled.length){put(tgt);toast('Ficha '+tgt.num+' completada con las fotos')}
    return;
  }catch(e){
    msg=e&&e.code==='not_granted'?'Lectura de tarjetas no permitida en este móvil.':e&&e.code==='rate_limited'?'Demasiadas lecturas seguidas; prueba en un momento.':e&&e.code==='images_unavailable'?'Esta vista no puede enviar fotos a Claude.':'No se pudo leer. Prueba otra foto, recta y con luz.';
  }finally{ocrBusy=false;if(ocrQ.length)setTimeout(()=>readCard(...ocrQ.shift()),0)}

}

  const fill=(r,k,v)=>{if(v&&!String(r[k]??'').trim()){r[k]=v;return 1}return 0};

    if(r){const prev=W.find(w=>w.r===r);if(!prev)r=JSON.parse(JSON.stringify(r));if(it.cl==='Reunión')normReu(r);
      ch+=fill(r,'codigo',it.cod)+fill(r,'stand',it.stand)+fill(r,'visitado',it.quien)+fill(r,'obs',it.obs)+fill(r,'gama',it.gama);
      if(it.cl==='Reunión'){ch+=fill(r,'rfecha',it.dia)+fill(r,'rhora',it.hora);
        for(const p of it.pts){const x=r.puntos.find(x=>(p.pre&&x.pre===p.pre)||normN(x.t)===normN(p.t));if(x){ch+=fill(x,'c',p.c)+fill(x,'n',p.n);continue}r.puntos.push({id:uid(),ok:false,...p});ch++}syncAcc(r)}
      else if(it.cl==='Cena'){ch+=fill(r,'rfecha',it.dia)+fill(r,'rhora',it.hora);if(it.dia&&!r.fecha)r.fecha=it.dia}
      else{if(it.noV&&r.plan==='Por visitar'){r.plan='No visitar';ch++}if(it.dia&&r.plan==='Por visitar'&&r.fecha!==it.dia){r.fecha=it.dia;ch++}}
      if(!ch||prev)return;cU++}
    else{isNew=true;const n=nxt[it.cl]++;r={id:'v'+(t0+ix).toString(36)+Math.random().toString(36).slice(2,6),feria,clase:it.cl,num:String(n),codigo:it.cod,empresa:it.emp,stand:it.stand,visitado:it.quien||ls.get('vf_yo',''),obs:it.obs,imgs:[]};
      if(it.cl==='Reunión'){Object.assign(r,{rfecha:it.dia,rhora:it.hora,fecha:it.dia||today(),puntos:it.pts.map(p=>({id:uid(),ok:false,...p})),acciones:[]});normReu(r);cR++}
      else if(it.cl==='Cena'){Object.assign(r,{rfecha:it.dia,rhora:it.hora,fecha:it.dia||today(),estado:''});delete r.codigo;delete r.stand;cC++}
      else{Object.assign(r,{fecha:it.dia||today(),plan:it.noV?'No visitar':'Por visitar',gama:it.gama,estado:it.noV?'':'Pendiente'});it.noV?cN++:cV++}}
    W.push({r,isNew})});
  const pl=(n,a,b)=>n+' '+(n===1?a:b);
  if(!W.length){await ask('Nada que cargar',`Todas las fichas de la plantilla ya están en «${h(feria)}» con esos datos.${skip?`<br><br>${pl(skip,'fila sin empresa no se carga','filas sin empresa no se cargan')}.`:''}`,[['Entendido','go']]);return}
  const ok=await ask('Cargar plantilla',`En «${h(feria)}» se ${cR+cV+cN+cC===1?'creará':'crearán'} ${[pl(cR,'reunión','reuniones'),pl(cV,'visita «Por visitar»','visitas «Por visitar»'),...(cC?[pl(cC,'cena','cenas')]:[]),...(cN?[pl(cN,'ficha «No visitar» (para saber dónde está)','fichas «No visitar» (para saber dónde están)')]:[])].join(', ').replace(/, ([^,]*)$/,' y $1')}${cU?`, y se ${cU===1?'completará':'completarán'} ${pl(cU,'ficha que ya existe','fichas que ya existen')}, sin borrar nada`:''}.${skip?`<br><br>${pl(skip,'fila sin empresa no se carga','filas sin empresa no se cargan')}.`:''}`,[['Cargar','go'],['Cancelar','']]);
  if(ok!=='Cargar')return;
  for(const{r}of W){if(Array.isArray(r.puntos)){r.atratar=ptsTxt(r,false);r.tratados=ptsTxt(r,true);r.accion=accTxt(r);r.estado=estadoReu(r)}r.updated=Date.now();outbox[r.id]=r}
  persist();renderAll();flush();
  await ask('Plantilla cargada',`${pl(cR,'reunión nueva','reuniones nuevas')}, ${pl(cV,'visita nueva','visitas nuevas')}${cC?`, ${pl(cC,'cena nueva','cenas nuevas')}`:''}${cN?`, ${pl(cN,'ficha «No visitar»','fichas «No visitar»')}`:''}${cU?` y ${pl(cU,'ficha completada','fichas completadas')}`:''}.`,[['Entendido','go']]);
}
async function save(filename,data){try{await dl.save({filename,data});toast('Descargado')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar ('+(e.code||'error')+')')}}

/* ---------- diálogos ---------- */
let dlgRes=null;
function ask(t,p,btns){return new Promise(ok=>{dlgRes=ok;$('#dlgIn').innerHTML=`<h2>${h(t)}</h2><p>${p}</p><div class="btns">${btns.map(([l,c])=>`<button class="${c}" data-a="${h(l)}">${h(l)}</button>`).join('')}</div>`;$('#dlg').hidden=false;$('#dlgIn button').focus()})}
function askText(t,p){return new Promise(ok=>{dlgRes=v=>ok(v==='OK'?$('#dlgT').value.trim():'');$('#dlgIn').innerHTML=`<h2>${h(t)}</h2><p>${h(p)}</p><div class="f" style="margin-bottom:12px"><input id="dlgT"></div><div class="btns"><button class="go" data-a="OK">Crear</button><button data-a="">Cancelar</button></div>`;$('#dlg').hidden=false;$('#dlgT').focus()})}
$('#dlg').onclick=e=>{const pb=e.target.closest('[data-pre]');if(pb){addPreset(pb.dataset.pre,pb);return}
  const b=e.target.closest('[data-a]');if(b||e.target.id==='dlg'){const r=dlgRes;dlgRes=null;$('#dlg').hidden=true;if(r)r(b?b.dataset.a:'')}};
function openPresets(){if(!cur)return;dlgRes=()=>{};const have=new Set((cur.puntos||[]).map(x=>x.pre).filter(Boolean));
  $('#dlgIn').innerHTML=`<h2>Puntos habituales</h2><p>Toca los que quieras añadir a esta reunión.</p><div class="prelist">${presets.map(q=>`<button type="button" class="pre" data-pre="${h(q.k)}" ${have.has(q.k)?'disabled':''}><span>${h(q.t)}</span><span class="tg">${rtag(q.r)}</span></button>`).join('')}</div><div class="btns" style="margin-top:12px"><button class="go" data-a="ok">Hecho</button></div>`;$('#dlg').hidden=false}
function addPreset(k,btn){const q=presets.find(x=>x.k===k);if(!q||!cur||(cur.puntos||[]).some(x=>x.pre===k))return;
  cur.puntos=[...(cur.puntos||[]),{id:uid(),t:q.t,ok:false,r:[...(q.r||[])],pre:k}];syncAcc(cur);draft();renderFormKeep();btn.disabled=true}
function editPreset(k){const q=presets.find(x=>x.k===k);if(!q||!db)return;
  dlgRes=async v=>{if(v!=='Guardar')return;const t=$('#dlgP').value.trim(),items=presets.map(x=>x.k===k?{...x,info:t}:x);
    try{await db.doc('config/puntos').set({items});presets=items;toast('Información guardada para todo el equipo');renderFormKeep()}catch(e){toast('No se pudo guardar. Revisa la conexión.')}};
  $('#dlgIn').innerHTML=`<h2>${h(q.t)}</h2><p>Información de este punto habitual. La verá todo el equipo en todas las reuniones.</p><div class="f" style="margin-bottom:12px"><textarea id="dlgP" rows="7">${h(q.info||'')}</textarea></div><div class="btns"><button class="go" data-a="Guardar">Guardar</button><button data-a="">Cancelar</button></div>`;
  $('#dlg').hidden=false;$('#dlgP').focus()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- arranque ---------- */
renderAll();
addEventListener('online',flush);
(async()=>{
  if(!window.claude||!claude.use){status='off';renderSync();return}
  status='load';renderSync();
  claude.use('downloads').then(x=>dl=x).catch(()=>{});
  claude.use('assets').then(x=>assets=x).catch(()=>{});
  claude.use('sample').then(async x=>{sample=x;if(x){const l=await x.limits().catch(()=>null);sampleImg=!!(l&&l.images);if(cur)renderFormKeep()}}).catch(()=>{});
  db=await claude.use('db').catch(()=>null);
  if(!db){status='off';renderSync();return}
  col=db.collection('visitas');
  db.doc('config/puntos').onSnapshot(d=>{const it=d.exists&&d.data().items;const ok=Array.isArray(it)?it.filter(x=>x&&x.k&&x.t):[];presets=ok.length?ok:PRE_DEF;if(cur&&!document.activeElement?.matches('#form textarea,#form input'))renderFormKeep()},()=>{});
  db.doc('config/maestro').onSnapshot(d=>{const it=d.exists&&d.data().items;maestro=Array.isArray(it)?it.filter(x=>x&&x.n):[];if(cur)renderFormKeep()},()=>{});
  const timer=setTimeout(()=>{if(status==='load'){status='off';renderSync()}},10000);
  col.onSnapshot(s=>{
    rows.clear();s.docs.forEach(d=>rows.set(d.id,{...d.data(),id:d.id}));
    if(!s.metadata.fromCache){clearTimeout(timer);status='on'}
    if(cur==null)renderAll();else{renderFerias();renderSync()}
    flush();
  },()=>{clearTimeout(timer);status='off';renderSync()});
  flush();
})();
}
